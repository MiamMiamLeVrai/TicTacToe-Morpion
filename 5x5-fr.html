        <h1>Le mode Morpion XL (5x5)</h1>
    </header>
    <div class="background" aria-hidden="true"></div>
    <main>
        <section class="morpion-classic">
            <h2>Morpion XL (5x5)</h2>
            <div class="grid" aria-label="Grille du morpion" role="grid">
                <button class="cell" data-cell="0" aria-label="Case vide, ligne 1, colonne 1"></button>
                <button class="cell" data-cell="1" aria-label="Case vide, ligne 1, colonne 2"></button>
                <button class="cell" data-cell="2" aria-label="Case vide, ligne 1, colonne 3"></button>
                <button class="cell" data-cell="3" aria-label="Case vide, ligne 1, colonne 4"></button>
                <button class="cell" data-cell="4" aria-label="Case vide, ligne 1, colonne 5"></button>
                <button class="cell" data-cell="5" aria-label="Case vide, ligne 2, colonne 1"></button>
                <button class="cell" data-cell="6" aria-label="Case vide, ligne 2, colonne 2"></button>
                <button class="cell" data-cell="7" aria-label="Case vide, ligne 2, colonne 3"></button>
                <button class="cell" data-cell="8" aria-label="Case vide, ligne 2, colonne 4"></button>
                <button class="cell" data-cell="9" aria-label="Case vide, ligne 2, colonne 5"></button>
                <button class="cell" data-cell="10" aria-label="Case vide, ligne 3, colonne 1"></button>
                <button class="cell" data-cell="11" aria-label="Case vide, ligne 3, colonne 2"></button>
                <button class="cell" data-cell="12" aria-label="Case vide, ligne 3, colonne 3"></button>
                <button class="cell" data-cell="13" aria-label="Case vide, ligne 3, colonne 4"></button>
                <button class="cell" data-cell="14" aria-label="Case vide, ligne 3, colonne 5"></button>
                <button class="cell" data-cell="15" aria-label="Case vide, ligne 4, colonne 1"></button>
                <button class="cell" data-cell="16" aria-label="Case vide, ligne 4, colonne 2"></button>
                <button class="cell" data-cell="17" aria-label="Case vide, ligne 4, colonne 3"></button>
                <button class="cell" data-cell="18" aria-label="Case vide, ligne 4, colonne 4"></button>
                <button class="cell" data-cell="19" aria-label="Case vide, ligne 4, colonne 5"></button>
                <button class="cell" data-cell="20" aria-label="Case vide, ligne 5, colonne 1"></button>
                <button class="cell" data-cell="21" aria-label="Case vide, ligne 5, colonne 2"></button>
                <button class="cell" data-cell="22" aria-label="Case vide, ligne 5, colonne 3"></button>
                <button class="cell" data-cell="23" aria-label="Case vide, ligne 5, colonne 4"></button>
                <button class="cell" data-cell="24" aria-label="Case vide, ligne 5, colonne 5"></button>
            </div>
        </section>

        <aside aria-labelledby="infos-title">
            <h2 id="infos-title">Choix du joueur</h2>
            <section class="player-choice">
                <div class="buttons">
                    <button id="iaChoice" aria-label="Contre une IA">Contre une IA</button>
                    <button id="humanChoice" aria-label="Contre un joueur">Contre un joueur</button>
                    <button id="startBtn" aria-label="Tirage au sort" disabled>Tirage au sort</button>
                    <button id="restartButton" aria-label="Recommencer la partie" disabled>Recommencer la
                        partie</button>
                </div>
            </section>
            <section class="player-infos">
                <h2>Informations de la partie</h2>
                <b>
                    <p id="playerSymbol" role="status" aria-live="polite"></p>
                </b>
                <b>
                    <p id="winsInfos" aria-live="polite" role="status"></p>
                </b>
            </section>
        </aside>
